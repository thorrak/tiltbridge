; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Added this here to "hard code" the environment for macro debugging/visuals/build (this needs to be commented out before merge for actions to work)
; default_envs = lcd_ssd1306
; default_envs = lcd_tft
; default_envs = tft_espi
; default_envs = esp32_s3_small_tft
description = Tilt Hydrometer-to-WiFi Bridge
; Source for the LittleFS image. NOT data/, which holds the built web UIs --
; those are compiled into firmware.bin now (tools/gen_embedded_ui.py) and are
; ~325 KB, far more than the 192 KiB the OTA partition layout leaves for a
; filesystem. Only genuine on-device filesystem content belongs here.
data_dir = fs_image

[common]
framework = espidf
; The default platform & platform package only applies to ESP32 derivatives
platform = espressif32@6.13.0
board_build.partitions = 4mb_inc_ota.csv
board_build.filesystem = littlefs
upload_speed = 460800
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
monitor_dtr = 1
monitor_rts = 1
lib_compat_mode = off
build_flags =                           ; Do not use spaces around the "=" here, will give you a builder not found error
    !python3 tools/git_rev.py           ; Pick up git information for version (disabled), branch, and commit (in version.cpp)
    -D PIO_SRC_TAG="2.0.0-beta5"                ; Increment versions shown in about.htm page (from version.cpp)
    ; Debug logging
    -D PRINT_GRAV_UPDATES=0             ; Turn on and off gravity printing to serial log
    -D CORE_DEBUG_LEVEL=0               ; Set core Arduino log level (5 = high)
    -D ARDUINO_LOG_LEVEL=6              ; Set Serial log level (6 = high)
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=0    ; Set NimBLE log level (4 = high)
    ;-D DISABLE_LOGGING                ; This will remove log lib from sketch
    ; Project conditional compile/options:
    -D BAUD=${common.monitor_speed}     ; Serial monitor baud setting
    -D FILESYSTEM_LITTLEFS              ; Define filesystem in use
    -D DISABLE_OTA_UPDATES=1
    -D WEBPORT=80
    ;-D FSEDIT=1                         ; Use a filesystem editor
    ; esp_wifi_config WebUI/BLE Kconfig now lives in sdkconfig.defaults (CONFIG_WIFI_CFG_*)

extra_scripts =
    tools/get_port.py                   ; Pick up port information based on OS
    pre:tools/build_ui.py               ; Build Vue UI and copy to data/ on buildfs
lib_ldf_mode = chain
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2  ; https://github.com/bblanchon/ArduinoJson
    https://github.com/thorrak/thorlog.git  ; ESP-IDF compatible replacement for Arduino-Log
#    esp_wifi_config is an ESP-IDF managed component, declared in src/idf_component.yml (not a PlatformIO lib_dep)
    
espi_lib_deps =
    #lovyan03/LovyanGFX @ ^1.2.21  ; https://github.com/lovyan03/LovyanGFX
    https://github.com/lovyan03/LovyanGFX.git#2e0dc974a9b6521bf155afb53a9a92a623a60803  ; // Need until LovyanGFX merges develop (and subsequently releases >=1.2.9) for ESP32-S3 support
build_type = release ; debug

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Individual build configurations
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[env:lcd_ssd1306]   ; Small OLED Board
board = heltec_wifi_kit_32
platform = ${common.platform}
framework = ${common.framework}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
lib_compat_mode = ${common.lib_compat_mode}
build_flags =
    ${common.build_flags}
    -DLCD_SSD1306
    -DDISABLE_OTA_UPDATES
    -D HARDWARE_VERSION="OLED LCD SSD1306"
lib_deps =
    ${common.lib_deps}
    ${common.espi_lib_deps}
extra_scripts = ${common.extra_scripts}
build_type = ${common.build_type}


[env:esp32_headless]   ; Headless & Buttonless ESP32 Board
board = lolin_d32
platform = ${common.platform}
framework = ${common.framework}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
build_flags =
    ${common.build_flags}
    -DDISABLE_OTA_UPDATES
    -DNO_BUTTONS
    -D HARDWARE_VERSION="Headless"
lib_deps =
    ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
build_type = ${common.build_type}


[env:esp32_large_tft]   ; Lolin ESP32 + ILI TFT
; board = lolin_d32_pro ; If we use the D32 Pro board definition, PSRAM gets enabled. Something, somewhere, is "consuming" it all.
board = lolin_d32  ; With the regular D32, PSRAM is not enabled which allows this to compile for now
platform = ${common.platform}
framework = ${common.framework}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
lib_compat_mode = ${common.lib_compat_mode}
build_flags =
    ${common.build_flags}
    -D LCD_LARGE_TFT=1
    -D TOUCH_CS=1
    -D SMOOTH_FONT=1
    -D LOAD_GFXFF=1
    -D HARDWARE_VERSION="TFT"
lib_deps =
    ${common.lib_deps}
    ${common.espi_lib_deps}
extra_scripts = ${common.extra_scripts}
build_type = ${common.build_type}


[env:esp32_small_tft]   ; Universal 135x240 SPI TFT (auto-detects M5StickC Plus/Plus2 and TTGO T-Display)
board = esp32dev
platform = ${common.platform}
framework = ${common.framework}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
upload_speed = 1500000
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
lib_compat_mode = ${common.lib_compat_mode}
build_flags =
    ${common.build_flags}
    -DLCD_SMALL_TFT=1
    -DAXP192=1
    -DDISABLE_OTA_UPDATES=1
    -DLOAD_GFXFF=1
    -D HARDWARE_VERSION="Small TFT"
lib_deps =
    ${common.lib_deps}
    ${common.espi_lib_deps}
extra_scripts = ${common.extra_scripts}
build_type = ${common.build_type}


[env:esp32_s3_oled]
board = heltec_wifi_kit_32_V3
platform = ${common.platform}
framework = ${common.framework}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
lib_compat_mode = ${common.lib_compat_mode}
build_flags =
    ${common.build_flags}
    -DLCD_SSD1306
    -DDISABLE_OTA_UPDATES
    ; The Heltec board has SDA/SCL on GPIO 17/18 respectively
    -DI2C_SDA_PIN=17
    -DI2C_SCL_PIN=18
    -DI2C_RESET_PIN=21
    ; To my knowledge the Heltec board doesn't have buttons, so we'll just use some random (unassigned) GPIOs
    -DBOARD_RESET_BUTTON_GPIO=5
    -DWIFI_RESET_BUTTON_GPIO=14
    -D HARDWARE_VERSION="S3 OLED"
    -D ESP32S3=1
lib_deps =
    ${common.lib_deps}
    ${common.espi_lib_deps}
extra_scripts = ${common.extra_scripts}
build_type = ${common.build_type}


[env:esp32_s3_small_tft]   ; Universal S3 small TFT (auto-detects M5StickC S3 and S3 T-Display)
board = heltec_wifi_kit_32_V3
platform = ${common.platform}
framework = ${common.framework}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
lib_compat_mode = ${common.lib_compat_mode}
build_flags =
    ${common.build_flags}
    -DLCD_SMALL_TFT=1
    -DDISABLE_OTA_UPDATES=1
    -DBOARD_RESET_BUTTON_GPIO=0
    -DWIFI_RESET_BUTTON_GPIO=14
    -D HARDWARE_VERSION="S3 Small TFT"
    -D ESP32S3=1
lib_deps =
    ${common.lib_deps}
    ${common.espi_lib_deps}
extra_scripts = ${common.extra_scripts}
build_type = ${common.build_type}
