; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Added this here to "hard code" the environment for macro debugging/visuals/build (this needs to be commented out before merge for actions to work)
; default_envs = lcd_ssd1306
; default_envs = d32_pro_tft
; default_envs = tft_espi
description = Tilt Hydrometer-to-WiFi Bridge

[common]
framework = arduino
; The default platform & platform package only applies to ESP32 derivatives
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
board_build.partitions = 4mb_no_ota.csv
board_build.filesystem = littlefs
upload_speed = 460800
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
monitor_dtr = 1
monitor_rts = 1

build_flags =                           ; Do not use spaces around the "=" here, will give you a builder not found error
    !python tools/git_rev.py            ; Pick up git information for version (disabled), branch, and commit (in version.cpp)
    -D PIO_SRC_TAG="2.0.0-beta1"                ; Increment versions shown in about.htm page (from version.cpp)
    ; BLE Settings:
    ;-D CONFIG_SW_COEXIST_PREFERENCE_BALANCED=1
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1   ; Disable NimBLE Server
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED=1  ; Disable NimBLE Broadcaster
    ; Debug logging
    -D PRINT_GRAV_UPDATES=0             ; Turn on and off gravity printing to serial log
    -D CORE_DEBUG_LEVEL=0               ; Set core Arduino log level (5 = high)
    -D ARDUINO_LOG_LEVEL=6              ; Set Serial log level (6 = high)
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=0    ; Set NimBLE log level (4 = high)
    ;-D DISABLE_LOGGING                ; This will remove log lib from sketch
    ; Project conditional compile/options:
    -D BAUD=${common.monitor_speed}     ; Serial monitor baud setting
    -D FILESYSTEM_LITTLEFS              ; Define filesystem in use
    -D DISABLE_OTA_UPDATES=1
    -D WEBPORT=80
    ;-D FSEDIT=1                         ; Use a filesystem editor
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1  ; Run Async TCP on core 1
extra_scripts = tools/get_port.py       ; Pick up port information based on OS
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2  ; https://github.com/bblanchon/ArduinoJson
    ; thijse/ArduinoLog @ 1.1.1 ; https://github.com/thijse/Arduino-Log.git
    https://github.com/thorrak/Arduino-Log.git ; // Need this until ArduinoLog merges https://github.com/thijse/Arduino-Log/pull/23 
    https://github.com/tzapu/WiFiManager.git#8e4c612fa3af0e3eb9d98b7a6da4acec0a37744a ; Anchor to latest commit as of 12/30/24
    h2zero/NimBLE-Arduino @ ^2.3.7  ; https://github.com/h2zero/NimBLE-Arduino
    256dpi/MQTT @ 2.5.2 ; https://github.com/256dpi/arduino-mqtt
;    lbussy/LCBUrl @ ^1.1.9
    https://github.com/thorrak/LCBUrl.git#arduino_v3
    ESP32Async/ESPAsyncWebServer @ ^3.9.3  ; https://github.com/ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP @ ^3.4.9  ; https://github.com/ESP32Async/AsyncTCP
espi_lib_deps = 
    ; lovyan03/LovyanGFX @ ^1.2.9  ; https://github.com/lovyan03/LovyanGFX
    https://github.com/lovyan03/LovyanGFX.git#2e0dc974a9b6521bf155afb53a9a92a623a60803  ; // Need until LovyanGFX merges develop (and subsequently releases >=1.2.9) for ESP32-S3 support 
build_type = release ; debug

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Individual build configurations
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[env:lcd_ssd1306]   ; Small OLED Board
board = heltec_wifi_kit_32
platform = ${common.platform}
framework = ${common.framework}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
build_flags = 
    ${common.build_flags}
    -DLCD_SSD1306
    -DDISABLE_OTA_UPDATES
    -D HARDWARE_VERSION="OLED LCD SSD1306"
lib_deps = 
    ${common.lib_deps}
    https://github.com/ThingPulse/esp8266-oled-ssd1306.git#4.6.1
build_type = ${common.build_type}


[env:esp32_headless]   ; Headless & Buttonless ESP32 Board
board = lolin_d32
platform = ${common.platform}
framework = ${common.framework}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
build_flags = 
    ${common.build_flags}
    -DDISABLE_OTA_UPDATES
    -DNO_BUTTONS
    -D HARDWARE_VERSION="Headless"
lib_deps = 
    ${common.lib_deps}
build_type = ${common.build_type}


[env:d32_pro_tft]   ; Lolin ESP32 + ILI TFT
; board = lolin_d32_pro ; If we use the D32 Pro board definition, PSRAM gets enabled. Something, somewhere, is "consuming" it all.
board = lolin_d32  ; With the regular D32, PSRAM is not enabled which allows this to compile for now
platform = ${common.platform}
framework = ${common.framework}
board_build.partitions = 4mb_no_ota.csv
board_build.filesystem = ${common.board_build.filesystem}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}

build_flags = 
    ${common.build_flags}
    -D LCD_TFT=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TOUCH_CS=12
    -D HARDWARE_VERSION="D32 Pro TFT"
    -D TFT_BL=32
lib_deps = 
    ${common.lib_deps}
    ${common.espi_lib_deps}
build_type = ${common.build_type}


[env:tft_espi]  ; TTGO TFT (USB-C) Board
; This is configured for a TTGO T-Display using the tft_espi drivers
; it should work for other tft_espi compatible displays, if you tweak
; the defines appropriately. See the documentation for TFT_eSPI at
; https://github.com/Bodmer/TFT_eSPI
board = esp32dev
platform = ${common.platform}
framework = ${common.framework}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
build_flags = 
    ${common.build_flags}
    -DLCD_TFT_ESPI=1
    -DDISABLE_OTA_UPDATES=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_BL=4
    -D HARDWARE_VERSION="ESPI TFT"
lib_deps = 
    ${common.lib_deps}
    ${common.espi_lib_deps}
build_type = ${common.build_type}

[env:m5stickc_plus]
board = esp32dev
platform = ${common.platform}
framework = ${common.framework}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
upload_speed = 1500000
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
build_flags = 
    ${common.build_flags}
    -DLCD_TFT_M5STICKC=1
    -DLCD_TFT_ESPI=1
    -DDISABLE_OTA_UPDATES
    -DBUTTON_INVERT
    -DAXP192=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DWIFI_RESET_BUTTON_GPIO=37
    -D HARDWARE_VERSION="M5"
lib_deps = 
    ${common.lib_deps}
    ${common.espi_lib_deps}
    tanakamasayuki/I2C AXP192 Power management@^1.0.4
build_type = ${common.build_type}
check_skip_packages = yes


[env:esp32_s3_oled]
board = heltec_wifi_kit_32_V3
platform = ${common.platform}
framework = ${common.framework}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
build_flags = 
    ${common.build_flags}
    ; -DLCD_SSD1306
    -DDISABLE_OTA_UPDATES
    ; The Heltec board has SDA/SCL on GPIO 17/18 respectively
    -DI2C_SDA_PIN=17
    -DI2C_SCL_PIN=18
    -DI2C_RESET_PIN=21
    ; To my knowledge the Heltec board doesn't have buttons, so we'll just use some random (unassigned) GPIOs
    -DBOARD_RESET_BUTTON_GPIO=5
    -DWIFI_RESET_BUTTON_GPIO=14
    -D HARDWARE_VERSION="S3 OLED"
    -D ESP32S3=1
lib_deps = 
    ${common.lib_deps}
    https://github.com/ThingPulse/esp8266-oled-ssd1306.git#4.3.0
build_type = ${common.build_type}


[env:esp32_s3_tdisplay]
board = heltec_wifi_kit_32_V3
platform = ${common.platform}
framework = ${common.framework}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
build_flags = 
    ${common.build_flags}
    -DLCD_TFT_ESPI=1
    -DDISABLE_OTA_UPDATES=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DPIN_POWER_ON=15
    -DBOARD_RESET_BUTTON_GPIO=0
    -DWIFI_RESET_BUTTON_GPIO=14
    -D HARDWARE_VERSION="S3 TDisplay"
    -D ESP32S3=1
lib_deps = 
    ${common.lib_deps}
    ${common.espi_lib_deps}
build_type = ${common.build_type}
