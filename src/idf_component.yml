## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true

  h2zero/esp-nimble-cpp: ^2.3.4
  espressif/mdns: "^1.2"
  joltwallet/littlefs: "^1.14"

  # WiFi provisioning (SoftAP captive portal + Network Provisioning over BLE),
  # multi-network storage, and the /api/wifi REST API. From the ESP Component
  # Registry. 0.2.0 dropped the esp_bus dependency; events now arrive on the
  # default esp_event loop under WIFI_CFG_EVENT.
  thorrak/esp_wifi_config:
    version: "^0.3.1"
    # Local development override: comment out `version` above and uncomment
    # the two lines below to build against a checkout of the library.
    # override_path: ../../esp_wifi_config
    # version: '*'
